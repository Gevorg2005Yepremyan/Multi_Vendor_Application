openapi: 3.0.3
info:
  title: Marketplace API
  description: API documentation for authentication, accounts, products, orders, inventories and admin operations
  version: 1.0.0

servers:
  - url: http://localhost:5000/api-docs

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

  User:
    type: object
    properties:
      _id:
        type: string
        example: "65a12f7b8e23d4a1a12e98c1"

      name:
        type: string

      surname:
        type: string

      age:
        type: integer
        example: 25

      email:
        type: string
        format: email

      username:
        type: string

      password:
        type: string
        format: password

      role:
        type: string
        description: Role ObjectId reference

      isActive:
        type: boolean
        default: false

      tokenVersion:
        type: integer
        default: 0

      resetPasswordToken:
        type: string
        nullable: true

      resetPasswordExpires:
        type: string
        format: date-time
        nullable: true

      profile:
        type: object
        properties:
          phone:
            type: string
          avatarUrl:
            type: string
          bio:
            type: string

    required:
      - name
      - surname
      - age
      - email
      - username
      - password

  Vendor:
    type: object
    properties:
      _id:
        type: string

      userId:
        type: string
        description: Reference to User

      companyName:
        type: string

      description:
        type: string

      verified:
        type: boolean
        default: false

    required:
      - userId
      - companyName

  Role:
    type: object
    properties:
      _id:
        type: string

      name:
        type: string
        enum:
          - vendor
          - user
          - customer
          - admin
        default: user

    required:
      - name

  Store:
    type: object
    properties:
      _id:
        type: string

      vendorId:
        type: string
        description: Vendor ObjectId

      name:
        type: string

      slug:
        type: string

      description:
        type: string

    required:
      - vendorId
      - name
      - slug

  Product:
    type: object
    properties:
      _id:
        type: string

      storeId:
        type: string

      sku:
        type: string

      title:
        type: string

      description:
        type: string

      price:
        type: number
        example: 25.5

      currency:
        type: string
        enum:
          - AMD
          - RUB
          - USD
          - EUR
          - JPY
          - CAD
          - CNH
          - AUD
          - NZD
          - ARS
        default: AMD

      images:
        type: array
        items:
          type: string

      isActive:
        type: boolean
        default: true

    required:
      - storeId
      - sku
      - title
      - price

  Review:
    type: object
    properties:
      _id:
        type: string

      productId:
        type: string

      userId:
        type: string

      rating:
        type: number
        minimum: 0
        maximum: 5

      title:
        type: string

      description:
        type: string

    required:
      - productId
      - userId
      - title

  Payment:
    type: object
    properties:
      _id:
        type: string

      orderId:
        type: string

      amount:
        type: number

      method:
        type: string
        enum:
          - stripe
          - paypal
          - balance
        default: balance

      providerData:
        type: object
        additionalProperties: true

      paymentStatus:
        type: string
        enum:
          - pending
          - succeeded
          - failure
        default: pending

    required:
      - orderId
      - amount

  OrderItem:
    type: object
    properties:
      productId:
        type: string

      title:
        type: string

      unitPrice:
        type: number
        default: 0

      quantity:
        type: number
        default: 0

    required:
      - productId
      - title

  Order:
    type: object
    properties:
      _id:
        type: string

      userId:
        type: string

      storeId:
        type: string

      items:
        type: array
        items:
          $ref: "#/components/schemas/OrderItem"

      totalAmount:
        type: number

      currency:
        type: string
        enum:
          - AMD
          - RUB
          - USD
          - EUR
          - JPY
          - CAD
          - CNH
          - AUD
          - NZD
          - ARS
        default: AMD

      status:
        type: string
        enum:
          - pending
          - paid
          - shipped
          - cancelled
        default: pending

    required:
      - userId
      - storeId
      - items
      - totalAmount

  Inventory:
    type: object
    properties:
      _id:
        type: string

      productId:
        type: string

      quantity:
        type: number
        minimum: 0

      reserved:
        type: number
        minimum: 0

    required:
      - productId

tags:
  - name: Auth
  - name: Accounts
  - name: Admin
  - name: Products
  - name: Inventories
  - name: Orders
  - name: Roles

paths:

# AUTH
  /auth/signup:
    post:
      tags: [Auth]
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                phone:
                  type: string
      responses:
        200:
          description: User created

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Login successful

  /auth/user:
    get:
      tags: [Auth]
      summary: Get current user
      security:
        - BearerAuth: []
      responses:
        200:
          description: Current user data

  /auth/logout:
    get:
      tags: [Auth]
      summary: Logout user
      security:
        - BearerAuth: []
      responses:
        200:
          description: Logout successful

  /auth/forgot-password:
    get:
      tags: [Auth]
      summary: Forgot password
      security:
        - BearerAuth: []
      responses:
        200:
          description: Reset instructions sent

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        200:
          description: Password updated

# ACCOUNTS
  /accounts/search/{text}:
    get:
      tags: [Accounts]
      summary: Search users
      security:
        - BearerAuth: []
      parameters:
        - name: text
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Users found

  /accounts/login-or-logout/{tokenVersion}:
    get:
      tags: [Accounts]
      summary: Get login or logout users
      security:
        - BearerAuth: []
      parameters:
        - name: tokenVersion
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: List of users

  /accounts/filter/{age}:
    get:
      tags: [Accounts]
      summary: Filter users by age
      security:
        - BearerAuth: []
      parameters:
        - name: age
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Filtered users

  /accounts/profile/{phone}/{avatarUrl}:
    get:
      tags: [Accounts]
      summary: Search profile
      security:
        - BearerAuth: []
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
        - name: avatarUrl
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Profile found

# ADMIN
  /admin/all:
    get:
      tags: [Admin]
      summary: Get all users
      security:
        - BearerAuth: []
      responses:
        200:
          description: Users list

  /admin/get/{id}:
    get:
      tags: [Admin]
      summary: Get user by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: User data

  /admin/update/{id}:
    put:
      tags: [Admin]
      summary: Update user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: User updated

  /admin/delete/{id}:
    delete:
      tags: [Admin]
      summary: Delete user
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: User deleted

# PRODUCTS
  /products/all:
    get:
      tags: [Products]
      summary: Get products
      security:
        - BearerAuth: []
      responses:
        200:
          description: Products list

  /products/create:
    post:
      tags: [Products]
      summary: Create product
      security:
        - BearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: number
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        200:
          description: Product created

  /products/get/{id}:
    get:
      tags: [Products]
      summary: Get product by id
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        200:
          description: Product found

  /products/update/{id}:
    put:
      tags: [Products]
      summary: Update product
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Product updated

  /products/delete/{id}:
    delete:
      tags: [Products]
      summary: Delete product
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Product deleted

# INVENTORIES
  /inventories/all:
    get:
      tags: [Inventories]
      summary: Get inventories
      security:
        - BearerAuth: []
      responses:
        200:
          description: Inventories list

  /inventories/create:
    post:
      tags: [Inventories]
      summary: Create inventory
      security:
        - BearerAuth: []
      responses:
        200:
          description: Inventory created

  /inventories/get/{id}:
    get:
      tags: [Inventories]
      summary: Get inventory
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Inventory found

# ORDERS
  /orders/all:
    get:
      tags: [Orders]
      summary: Get all orders
      security:
        - BearerAuth: []
      responses:
        200:
          description: Orders list

  /orders/create:
    post:
      tags: [Orders]
      summary: Create order
      security:
        - BearerAuth: []
      responses:
        200:
          description: Order created

  /orders/my:
    get:
      tags: [Orders]
      summary: Get my orders
      security:
        - BearerAuth: []
      responses:
        200:
          description: My orders

  /orders/get/{id}:
    get:
      tags: [Orders]
      summary: Get order by id
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Order found

# ROLES
  /roles/add:
    post:
      tags: [Roles]
      summary: Add role
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Role"
      responses:
        200:
          description: Role added

  /roles/get/{id}:
    get:
      tags: [Roles]
      summary: Get role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Role found

  /roles/getAll:
    get:
      tags: [Roles]
      summary: Get all roles
      responses:
        200:
          description: Roles list

  /roles/delete/{id}:
    delete:
      tags: [Roles]
      summary: Delete role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Role deleted

#STORES
  /stores/all:
    get:
      tags: [Stores]
      summary: Get all stores (Admin only)
      security:
        - BearerAuth: []
      responses:
        200:
          description: List of stores

  /stores/create:
    post:
      tags: [Stores]
      summary: Create new store
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                address:
                  type: string
      responses:
        200:
          description: Store created

  /stores/get:
    get:
      tags: [Stores]
      summary: Get vendor store
      security:
        - BearerAuth: []
      responses:
        200:
          description: Store details

  /stores/update:
    put:
      tags: [Stores]
      summary: Update vendor store
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                address:
                  type: string
      responses:
        200:
          description: Store updated

  /stores/delete:
    delete:
      tags: [Stores]
      summary: Delete vendor store
      security:
        - BearerAuth: []
      responses:
        200:
          description: Store deleted

#USERS
  /users/profile:
    post:
      tags: [Users]
      summary: Upload user profile avatar
      security:
        - BearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatarUrl:
                  type: string
                  format: binary
      responses:
        200:
          description: Profile uploaded

    put:
      tags: [Users]
      summary: Update user profile avatar
      security:
        - BearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatarUrl:
                  type: string
                  format: binary
      responses:
        200:
          description: Profile updated

  /users/edit:
    put:
      tags: [Users]
      summary: Edit user information
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                phone:
                  type: string
                name:
                  type: string
      responses:
        200:
          description: User updated

  /users/activity:
    get:
      tags: [Users]
      summary: Switch user activity
      security:
        - BearerAuth: []
      responses:
        200:
          description: Activity switched

#VENDORS
  /vendors/profile:
    post:
      tags: [Vendors]
      summary: Upload vendor profile avatar
      security:
        - BearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatarUrl:
                  type: string
                  format: binary
      responses:
        200:
          description: Vendor profile uploaded

    put:
      tags: [Vendors]
      summary: Update vendor profile avatar
      security:
        - BearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatarUrl:
                  type: string
                  format: binary
      responses:
        200:
          description: Vendor profile updated

  /vendors/edit:
    put:
      tags: [Vendors]
      summary: Edit vendor information
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Vendor updated

  /vendors/activity:
    get:
      tags: [Vendors]
      summary: Switch vendor activity
      security:
        - BearerAuth: []
      responses:
        200:
          description: Activity switched
